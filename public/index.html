<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TapTap2026 · 内部 Review 站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="container">
    <h1>🎮 TapTap2026 <span class="grad">内部 Review 站</span></h1>
    <p class="sub">Godot 开发 · 浏览器即点即玩 · 试玩后打个分、留句话，帮我们把游戏做得更好</p>
  </div>
</header>

<main class="container">
  <div id="builds" class="cards"></div>
  <div id="empty" class="empty" hidden>
    <p style="font-size:40px">📦</p>
    <p>还没有任何可试玩的构建。</p>
    <p class="muted">把 Godot 的 Web 导出结果放到 <code>builds/&lt;版本名&gt;/</code> 目录（含 <code>index.html</code> 和 <code>build.json</code>），刷新本页即可显示。详见 README。</p>
  </div>
</main>

<footer class="container foot">
  <span class="muted">内部评审 + 好友试玩共用一个链接 · 反馈数据保存在服务器 <code>data/db.json</code></span>
</footer>

<script src="index.js"></script>
</body>
</html>
