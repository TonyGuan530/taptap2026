<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TapTap2026 · 归档区</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="stylesheet" href="style.css">
<style>
  main{max-width:1040px;margin:auto;padding:24px 20px}
  h1{font-size:28px}h2{font-size:22px}
  .archive-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}
  .arch-card{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--card);overflow-wrap:anywhere}
  .arch-card h3{margin:0 0 8px;font-size:18px}
  .arch-card .reason{color:#b8c0d0;font-size:14px;margin-top:8px}
  .arch-card .meta{color:var(--muted);font-size:12px;margin-top:8px}
  .arch-card video{display:block;width:100%;aspect-ratio:16/9;background:#09191e;border-radius:6px;margin:14px 0}
  .arch-card a{color:#9bbdff}details{margin-top:30px}summary{cursor:pointer;font-size:18px}
  #list{display:grid;gap:12px;margin-top:16px}
</style>
</head>
<body>
<main>
  <p><a class="btn ghost" href="index.html">← 返回试玩首页</a></p>
  <h1>📦 旧版归档</h1>
  <p class="muted">旧版录像与历史记录保留在这里。现在试玩小画家，请选择 V10 触控版。</p>
  <p><a class="btn" href="inkbound-v10.html">进入最新小画家 V10 ↗</a></p>
  <section id="inkbound-archive" aria-labelledby="archive-title">
    <h2 id="archive-title">小画家与恐龙 · 历史版本</h2>
    <div id="featured" class="archive-grid"><p class="muted">加载归档录像…</p></div>
  </section>
  <details id="other-history">
    <summary>其他归档记录</summary>
    <div id="list"></div>
  </details>
</main>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localPath=value=>typeof value==='string'&&/^[a-zA-Z0-9][a-zA-Z0-9_./-]*$/.test(value)&&!value.split('/').includes('..')?value:'';
fetch('archive.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{
  const archived=(d.items||[]).filter(x=>x.status==='archived');
  const featured=archived.filter(x=>x.featured).sort((a,b)=>(a.displayOrder??999)-(b.displayOrder??999));
  document.getElementById('featured').innerHTML=featured.map(x=>{
    const video=localPath(x.videoUrl),poster=localPath(x.poster);
    return `<article class="arch-card" data-build="${esc(x.id)}"><span class="chip dim">已归档</span><h3>${esc(x.title||x.id)}</h3><p class="reason">${esc(x.reason||'已由更新版本替代。')}</p>${video?`<video controls playsinline preload="none"${poster?` poster="${poster}"`:''}><source src="${video}" type="video/mp4"></video><a href="${video}" download>下载旧版实机录像</a>`:''}<p class="meta">${esc(x.id)} · 构建保留在 git 历史中</p></article>`;
  }).join('')||'<p class="muted">暂无归档录像。</p>';
  document.getElementById('list').innerHTML=archived.filter(x=>!x.featured).map(x=>`<article class="arch-card"><b>${esc(x.title||x.id)}</b><div class="reason">${esc(x.reason||'历史版本，已归档。')}</div><div class="meta">${esc(x.id)} · git 历史可恢复</div></article>`).join('')||'<p class="muted">暂无其他归档记录。</p>';
}).catch(()=>{document.getElementById('featured').textContent='归档记录暂时无法加载，请刷新页面。'});
</script>
</body>
</html>
